<!doctype html><html><head><title>Login</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><div class="card auth"><h2>Login</h2>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="msg {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button class="btn">Login</button></form><p>New user? <a href="{{url_for('register')}}">Register</a></p></div></body></html>
