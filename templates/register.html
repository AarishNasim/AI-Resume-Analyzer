<!doctype html><html><head><title>Register</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><div class="card auth"><h2>Create account</h2>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="msg {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password (6+ chars)" required><button class="btn">Register</button></form><p>Already have an account? <a href="{{url_for('login')}}">Login</a></p></div></body></html>
