<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Resume Atlas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="auth-page"><a class="brand auth-brand" href="{{url_for('home')}}"><span class="brand-mark">RA</span><span>Resume Atlas</span></a><main class="auth-card"><p class="eyebrow">START YOUR NEXT CHAPTER</p><h1>A resume that sounds like you.</h1><p class="muted">Choose a format, add your story, and make every application count.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for c,m in messages %}<div class="msg {{c}}">{{m}}</div>{% endfor %}{% endwith %}<form method="post" class="auth-form"><label>Full name<input name="name" placeholder="Your name" required></label><label>Email<input name="email" type="email" placeholder="you@example.com" required></label><label>Password<input name="password" type="password" placeholder="At least 6 characters" required></label><button class="button button-dark" type="submit">Create account</button></form><p class="auth-footer">Already have an account? <a href="{{url_for('login')}}">Log in</a></p></main></body></html>
